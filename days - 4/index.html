<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10131c">
    <title>Day 4 — Digital Clock</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="clock-card">
        <header class="topbar">
            <p class="eyebrow">WAKTUNYA SEKARANG</p>
            <button class="theme-toggle" type="button" aria-label="Ganti ke tema terang" aria-pressed="false">
                <span class="theme-icon" aria-hidden="true">☀</span>
                <span class="theme-label">Mode terang</span>
            </button>
        </header>

        <section class="clock-content" aria-label="Jam digital">
            <p class="day"></p>
            <div class="clock" role="timer" aria-live="off">00:00:00</div>
            <p class="date"></p>
        </section>

        <section class="meme-slot" aria-label="Area meme">
            <!-- <div class="meme-placeholder" aria-hidden="true"><span>😂</span></div> -->
            <div class="meme-copy">
                <!-- <p class="meme-title">Meme corner</p>
                <p class="meme-hint">Tempat buat meme favorit lo</p> -->
            </div>
        </section>
    </main>
</body>
</html>
